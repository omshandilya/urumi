apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ .Release.Name }}-mariadb, namespace: {{ .Values.namespace }} }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.mariadb.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-mariadb, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: mariadb }
  ports: [{ port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-mariadb, namespace: {{ .Values.namespace }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mariadb-root-password } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mariadb-password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          readinessProbe: { exec: { command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: mysql }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
      volumes: [{ name: data, persistentVolumeClaim: { claimName: {{ .Release.Name }}-mariadb } }]
