{{- $required := list .Values.secrets.mariadbRootPassword .Values.secrets.mariadbPassword .Values.secrets.wordpressAdminPassword .Values.secrets.wooConsumerKey .Values.secrets.wooConsumerSecret .Values.secrets.mcpSharedToken }}
{{- if has "" $required }}{{ fail "All secrets must be supplied through a non-committed values-secrets file." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.secrets.mariadbRootPassword | quote }}
  mariadb-password: {{ .Values.secrets.mariadbPassword | quote }}
  wordpress-admin-password: {{ .Values.secrets.wordpressAdminPassword | quote }}
  woo-consumer-key: {{ .Values.secrets.wooConsumerKey | quote }}
  woo-consumer-secret: {{ .Values.secrets.wooConsumerSecret | quote }}
  mcp-shared-token: {{ .Values.secrets.mcpSharedToken | quote }}
