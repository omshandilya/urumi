apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-woocommerce-mcp, namespace: {{ .Values.namespace }} }
spec:
  type: ClusterIP
  selector: { app: woocommerce-mcp }
  ports: [{ port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-woocommerce-mcp, namespace: {{ .Values.namespace }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: woocommerce-mcp } }
  template:
    metadata: { labels: { app: woocommerce-mcp } }
    spec:
      containers:
        - name: woocommerce-mcp
          image: {{ .Values.images.woocommerceMcp }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: WOOCOMMERCE_URL, value: http://{{ .Release.Name }}-wordpress }
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: woo-consumer-key } }
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: woo-consumer-secret } }
            - name: MCP_SHARED_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mcp-shared-token } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
