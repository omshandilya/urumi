apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wordpress-bootstrap
  namespace: {{ .Values.namespace }}
  annotations: { "helm.sh/hook": post-install,post-upgrade, "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: wordpress:cli-2.11-php8.3
          command: ["sh", "-ec"]
          args:
            - |
              until wp core is-installed --path=/var/www/html --allow-root 2>/dev/null; do
                wp core install --path=/var/www/html --url="http://{{ .Values.wordpress.host }}" --title="{{ .Values.bootstrap.siteTitle }}" --admin_user="{{ .Values.bootstrap.adminUser }}" --admin_password="$WORDPRESS_ADMIN_PASSWORD" --admin_email="{{ .Values.bootstrap.adminEmail }}" --skip-email --allow-root || true
                sleep 5
              done
              wp plugin install woocommerce --activate --path=/var/www/html --allow-root
              wp option update woocommerce_currency "{{ .Values.bootstrap.currency }}" --path=/var/www/html --allow-root
              wp eval '$key=getenv("WOO_KEY"); $secret=getenv("WOO_SECRET"); global $wpdb; $table=$wpdb->prefix."woocommerce_api_keys"; if (!$wpdb->get_var($wpdb->prepare("SELECT key_id FROM $table WHERE consumer_key=%s", wc_api_hash($key)))) { $wpdb->insert($table,["user_id"=>1,"description"=>"Urumi MCP","permissions"=>"read_write","consumer_key"=>wc_api_hash($key),"consumer_secret"=>$secret,"truncated_key"=>substr($key,-7)]); }' --path=/var/www/html --allow-root
          env:
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: wordpress-admin-password } }
            - name: WOO_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: woo-consumer-key } }
            - name: WOO_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: woo-consumer-secret } }
          volumeMounts: [{ name: wordpress, mountPath: /var/www/html }]
      volumes: [{ name: wordpress, persistentVolumeClaim: { claimName: {{ .Release.Name }}-wordpress } }]
