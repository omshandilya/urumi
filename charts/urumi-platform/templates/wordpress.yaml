apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ .Release.Name }}-wordpress, namespace: {{ .Values.namespace }} }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.wordpress.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-wordpress, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: wordpress }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-wordpress, namespace: {{ .Values.namespace }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: wordpress } }
  template:
    metadata: { labels: { app: wordpress } }
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          ports: [{ name: http, containerPort: 80 }]
          env:
            - { name: WORDPRESS_DB_HOST, value: {{ .Release.Name }}-mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mariadb-password } }
          volumeMounts: [{ name: wordpress, mountPath: /var/www/html }]
          readinessProbe: { httpGet: { path: /wp-login.php, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /wp-login.php, port: http }, initialDelaySeconds: 45, periodSeconds: 15 }
          resources: {{- toYaml .Values.wordpress.resources | nindent 12 }}
      volumes: [{ name: wordpress, persistentVolumeClaim: { claimName: {{ .Release.Name }}-wordpress } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ .Release.Name }}-store, namespace: {{ .Values.namespace }} }
spec:
  ingressClassName: nginx
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.wordpress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.wordpress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-wordpress, port: { number: 80 } } }
