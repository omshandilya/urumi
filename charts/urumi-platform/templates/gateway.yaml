apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-gateway, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: gateway }
  ports: [{ port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-gateway, namespace: {{ .Values.namespace }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: DB_HOST, value: {{ .Release.Name }}-mariadb }
            - { name: DB_NAME, value: wordpress }
            - { name: DB_USER, value: wordpress }
            - { name: BOOTSTRAP_ADMIN_EMAIL, value: {{ .Values.bootstrap.adminEmail | quote }} }
            - { name: WOOCOMMERCE_MCP_URL, value: http://{{ .Release.Name }}-woocommerce-mcp:3000/mcp }
            - { name: SHIPPING_MCP_URL, value: http://{{ .Release.Name }}-shipping-mcp:3000/mcp }
            - { name: CALCULATOR_MCP_URL, value: http://{{ .Release.Name }}-calculator-mcp:3000/mcp }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mariadb-password } }
            - name: BOOTSTRAP_ADMIN_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: gateway-admin-key } }
            - name: KEY_PEPPER
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: gateway-key-pepper } }
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: gateway-credential-encryption-key } }
            - name: WOOCOMMERCE_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-credentials, key: mcp-shared-token } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ .Release.Name }}-gateway, namespace: {{ .Values.namespace }} }
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.gateway.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-gateway, port: { number: 3000 } } }
