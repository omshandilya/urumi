secrets:
  mariadbRootPassword: "replace-with-a-long-random-value"
  mariadbPassword: "replace-with-a-different-long-random-value"
  wordpressAdminPassword: "replace-with-a-long-random-value"
  # Must start ck_ and cs_. Generate them with the commands in README.
  wooConsumerKey: "ck_replace_me"
  wooConsumerSecret: "cs_replace_me"
  mcpSharedToken: "replace-with-a-long-random-token"
  gatewayAdminKey: "uk_replace-with-the-bootstrap-admin-key"
  gatewayKeyPepper: "replace-with-a-long-random-token"
  # `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`
  gatewayCredentialEncryptionKey: "replace-with-a-base64-encoded-32-byte-key"
  # Used only by the gateway's dashboard chat agent; it is never sent to browsers.
  llmApiKey: "replace-with-your-provider-key"
